<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="stylesheet" href="RETEST.css">
  <meta charset="UTF-8">
  <title>Todo List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

  </style>
</head>
<body>
<h1>HIGH</h1>

<!-- Поле ввода для новой задачи -->
<input type="text" id="todo-input" placeholder="Добавить важных дел">
<button id="add-todo-btn">+</button>

<!-- Контейнер для списка задач -->
<ul id="todo-list"></ul>
<h1>LOW</h1>
<input type="text" id="todo2" placeholder="Добавить">
<button id="add2">+</button>

<ul id="todo-ul"></ul>
<script>

  // Массив для хранения задач
  const todos = [];

  // Функция добавления задачи
  function addTodo() {
    const input = document.getElementById('todo-input');
    const todoText = input.value.trim(); // Убираем лишние пробелы

    if (todoText !== "") { //!== ЗНАЧИТ НЕ РАВНО
      // Создаем объект задачи
      const newTodo = {
        id: Date.now(),   // Генерируем уникальный идентификатор
        text: todoText,
        completed: false  // Можно расширить функционал, добавив возможность отмечать выполненные задачи
      };

      // Добавляем задачу в массив
      todos.push(newTodo);

      // Очищаем поле ввода
      input.value = "";

      // Перерисовываем список задач
      renderTodos();
    }
  }

  // Функция удаления задачи
  function deleteTodo(id) {
    const index = todos.findIndex(todo => todo.id === id); // Находим индекс задачи
    if (index !== -1) {
      todos.splice(index, 1); // Удаляем задачу из массива
      renderTodos(); // Перерисовываем список задач
    }
  }

  // Функция для отрисовки списка задач
  function renderTodos() {
    const todoList = document.getElementById('todo-list');
    todoList.innerHTML = ""; // Очищаем текущий список

    // Проходим по всем задачам и добавляем их в список
    todos.forEach(todo => {
      const li = document.createElement('li');

      //чекбокс для задачи
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      li.appendChild(checkbox);

      // Текст задачи
      const span = document.createElement('span');
      span.textContent = todo.text;
      li.appendChild(span);

      // Кнопка удаления
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Х';
      deleteBtn.classList.add('delete-btn');
      deleteBtn.onclick = () => deleteTodo(todo.id); // Привязываем функцию удаления
      li.appendChild(deleteBtn);

      // Добавляем задачу в список
      todoList.appendChild(li);
    });
  }
  // Назначаем обработчик события для кнопки добавления задачи
  document.getElementById('add-todo-btn').addEventListener('click', addTodo);



  const todous = [];
  // Функция добавления задачи
  function addTodous() {
    const input2 = document.getElementById('todo2');
    const todoText2 = input2.value.trim(); // Убираем лишние пробелы

    if (todoText2 !== "") {
      // Создаем объект задачи
      const newTodo2 = {
        id: Date.now(),   // Генерируем уникальный идентификатор
        text: todoText2,
        completed: false  // Можно расширить функционал, добавив возможность отмечать выполненные задачи
      };

      // Добавляем задачу в массив
      todous.push(newTodo2);


      // Очищаем поле ввода
      input2.value = "";

      // Перерисовываем список задач
      renderTodous();
    }
  }

  // Функция удаления задачи
  function deleteTodo1(id) {
    const index = todous.findIndex(todo => todo.id === id); // Находим индекс задачи
    if (index !== -1) {
      todous.splice(index, 1); // Удаляем задачу из массива
      renderTodous(); // Перерисовываем список задач LOW
    }
  }

  // Функция для отрисовки списка задач LOW
  function renderTodous() {
    const todoList3 = document.getElementById('todo-ul');
    todoList3.innerHTML = ""; // Очищаем текущий список

    // Проходим по всем задачам и добавляем их в список
    todous.forEach(todo => {
      const li = document.createElement('li');

      //чекбокс для задачи
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      li.appendChild(checkbox);

      // Текст задачи
      const span = document.createElement('span');
      span.textContent = todo.text;
      li.appendChild(span);

      // Кнопка удаления
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Х';
      deleteBtn.classList.add('delete-btn');
      deleteBtn.onclick = () => deleteTodo1(todo.id); // Привязываем функцию удаления
      li.appendChild(deleteBtn);

      // Добавляем задачу в список
      todoList3.appendChild(li);
    });

  }
  // Назначаем обработчик события для кнопки добавления задачи LOW
  document.getElementById('add2').addEventListener('click', addTodous);




</script>
</body>
</html>
